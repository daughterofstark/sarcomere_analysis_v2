[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sarcomere-analysis"
version = "0.1.0"
description = "Classical image-analysis pipeline for archival myocardium sarcomeric organization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scipy>=1.9",
  "tifffile>=2023.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
